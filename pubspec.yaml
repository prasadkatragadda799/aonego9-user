name: aonego9_user
description: "AOneGo9 — Modeling Agency & Production House. Browse verified talent, venues, photographers, videographers & event services."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  provider: ^6.1.2
  http: ^1.2.2
  # Directly imported by data/api_client.dart for MediaType on multipart
  # uploads. Declared explicitly rather than relied on as a transitive dep of
  # `http`, so a future http release can't silently break the build.
  http_parser: ^4.0.2
  # Used by lead_form.dart and core/utils/date_util.dart for DateFormat.
  # Was imported without being declared, which broke the build outright.
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  # Opens social handles, partner sites and ad click-throughs. The brief's
  # "add to URL link bio me" is inert without it.
  url_launcher: ^6.3.1
  # Inline playback for video ad creatives and profile showreels.
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Brand artwork — see assets/brand/README.md. Listed file-by-file rather
    # than as a directory so the README isn't shipped in the web bundle.
    - assets/brand/aonego9_logo.png
    - assets/brand/aonego9_lockup.png
